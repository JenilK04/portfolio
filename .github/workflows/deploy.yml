name: Deploy Next.js Static Site to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers deployment whenever you push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || hashFiles('yarn.lock') != '' && 'yarn' || 'npm' }}

      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile;
          elif [ -f package-lock.json ]; then npm ci;
          else npm install;
          fi

      - name: Static HTML export with Next.js
        run: |
          if [ -f yarn.lock ]; then yarn build;
          else npm run build;
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Uploads the generated static out/ folder

  deploy:
    environment:
      name: github-pages
      url: "${{ steps: deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4